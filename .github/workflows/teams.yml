name: Update popular teams
on:
  schedule:
    - cron: "0 4 5 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -I -X utf8 scripts/build_teams.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain meta/teams.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meta/teams.js
            git commit -m "Update popular teams"
            git push
          fi
